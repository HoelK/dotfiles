[main]
hide-before-typing=yes

#Font
font=Monocraft:size=12
dpi-aware=yes

#Prompt
message="     APPLICATION LAUNCHER"
prompt="> "
placeholder="application..."

#Result and spaces
lines=5
line-height=25
inner-pad=20
vertical-pad=15


[colors]
